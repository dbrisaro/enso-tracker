name: Update tracker

# Rebuilds the tracker from the upstream feeds and publishes it to the Jekyll
# site repo. The page is a Jekyll collection file there, so this pushes to
# dbrisaro.github.io rather than deploying anything itself; GitHub Pages builds
# the site from that push.
#
# Cadence follows the slowest useful feed rather than the fastest: CPC posts
# weekly SST on Mondays, so this runs Tuesday and picks up the monthly ONI and
# the mid-month IRI plume whenever they happen to have landed.

on:
  schedule:
    - cron: "17 7 * * 2"   # Tuesdays 07:17 UTC
  workflow_dispatch:        # and on demand, from the Actions tab

concurrency:
  group: update-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # To append to runs.log below. The account default is read-only, so the
    # token gets write only here, and only for this repo's contents.
    permissions:
      contents: write

    steps:
      - name: Check out the generator
        uses: actions/checkout@v4

      - name: Check out the site repo
        uses: actions/checkout@v4
        with:
          repository: dbrisaro/dbrisaro.github.io
          ref: master
          path: site
          # Deploy key, so this cannot touch any other repo on the account.
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and stage the page
        run: python update.py --deploy site

      - name: Commit and push
        id: publish
        working-directory: site
        run: |
          git config user.name  "enso-tracker bot"
          git config user.email "dbrisaro@gmail.com"
          if git diff --quiet -- _portfolio/enso-tracker.html; then
            echo "Page unchanged, nothing to publish."
            echo "result=unchanged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add _portfolio/enso-tracker.html
          git commit -m "update ENSO tracker $(date -u +%Y-%m-%d)"
          git push origin master
          echo "result=published" >> "$GITHUB_OUTPUT"

      # Everything above lands in the site repo, which leaves this one with no
      # commits at all. GitHub disables a scheduled workflow after 60 days
      # without activity in its own repo, which is how the schedule switched
      # itself off on 2026-10-27 after running fine since August. The log is
      # also the only place that says what each run actually did, and it runs
      # even after a failed build so that a bad week does not stop the clock.
      - name: Record the run here
        if: success() || failure()
        run: |
          git config user.name  "enso-tracker bot"
          git config user.email "dbrisaro@gmail.com"
          printf '%s  %s\n' "$(date -u +%Y-%m-%d)" "${{ steps.publish.outputs.result || 'failed' }}" >> runs.log
          git add runs.log
          git commit -m "log run $(date -u +%Y-%m-%d)"
          git push origin main
